[project]
name = "errorlogger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "gunicorn",
    "whitenoise",
    "dj-database-url",
]

[tool.vercel]
entrypoint = "errorlogger.wsgi:application"

[tool.vercel.scripts]
build = "python manage.py collectstatic --noinput && python manage.py migrate"